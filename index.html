<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facility 70: Sector 7</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23060a0d'/%3E%3Cpath d='M14 14h36v36H14z' fill='none' stroke='%237fe6ff' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="game-shell">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div id="hud">
        <div id="title">FACILITY 70: SECTOR 7</div>
        <div id="objective">Objetivo: activar 3 protocolos y escapar del sector.</div>
        <div class="panel">
          <div class="meter-row">
            <span>VIDA</span>
            <div class="meter"><div id="healthFill" class="fill health"></div></div>
          </div>
          <div class="meter-row">
            <span>BATERÍA</span>
            <div class="meter"><div id="batteryFill" class="fill battery"></div></div>
          </div>
        </div>
        <div id="status">Estado: bajo observación</div>
        <div id="controls">W/S avanzar · A/D desplazarte · Q/E girar · Shift correr · F/Space sonar · acércate a los protocolos</div>
      </div>
      <div id="messageBox" class="hidden"></div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
